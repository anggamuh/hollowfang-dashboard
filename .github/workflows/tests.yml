name: tests

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.3'
          tools: composer:v2
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'

      - name: Setup Application
        run: composer setup

      # The imported repository contains legacy backup copies with pre-existing
      # Pint violations. Keep CI focused on runtime correctness and compiled views.
      - name: Check changed PHP syntax
        run: |
          php -l app/Support/HollowfangAudit.php
          php -l app/Livewire/HollowfangV3.php
          php -l tests/Unit/HollowfangAuditTest.php
          php -l tests/Feature/HollowfangAuditExportTest.php
          php -l app/Services/ManukApiService.php
          php -l app/Livewire/ControlCenter.php
          php -l database/migrations/0001_01_01_000000_create_users_table.php
          php -l tests/Feature/ManukApiServiceTest.php
          php -l tests/Feature/HollowfangControlCenterTest.php

      - name: Compile Control Center Blade views
        run: php scripts/check-control-center-blade.php

      - name: Run Control Center and monitoring regression tests
        run: php artisan test tests/Feature/HollowfangVisualPreviewTest.php tests/Feature/HollowfangPlanningTest.php tests/Feature/HollowfangUsabilityTest.php tests/Feature/HollowfangOperationsUpgradeTest.php tests/Feature/BotStatusHistoryTest.php tests/Feature/HollowfangControlCenterTest.php tests/Feature/ManukApiServiceTest.php tests/Unit/HollowfangAuditTest.php tests/Feature/HollowfangAuditExportTest.php

      - name: Render static visual review with synthetic data
        run: HF_VISUAL_PREVIEW=1 php artisan test tests/Feature/HollowfangVisualPreviewTest.php

      - name: Check desktop and mobile layout
        run: |
          npm install --prefix "$RUNNER_TEMP/hf-visual" --no-package-lock playwright@1.56.1 alpinejs@3.15.12
          "$RUNNER_TEMP/hf-visual/node_modules/.bin/playwright" install --with-deps chromium
          HF_VISUAL_RUNTIME="$RUNNER_TEMP/hf-visual" node scripts/check-workspace-layout.cjs

      - name: Upload visual review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hollowfang-visual-preview
          path: storage/app/visual-preview/
          retention-days: 7
